<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神祕日記：解謎冒險 - 投影優化版</title>
    <!-- 引入 Google Fonts: 思源宋體 (Noto Serif TC) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #2c1a1a; 
            --paper-color: #e8d5b5; 
            --text-color: #3e2a1c; 
            --accent-color: #7a3e1a; 
            --error-color: #a62c2c; 
            --success-color: #2d6a4f; 
            --border-color: #3d2b1f;
        }

        /* 全域重設 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Noto Serif TC', serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 16:9 主容器 */
        .game-frame {
            width: min(95vw, calc(95vh * 16 / 9));
            aspect-ratio: 16 / 9;
            max-height: 95vh;
            background-color: var(--paper-color);
            background-image: 
                url("https://www.transparenttextures.com/patterns/paper-fibers.png"),
                radial-gradient(circle, rgba(255,255,255,0.2) 0%, rgba(0,0,0,0.05) 100%);
            box-shadow: 0 0 60px rgba(0,0,0,0.8);
            position: relative;
            border: 1.2vh solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 2vh 3vw;
        }

        .page {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            animation: fadeIn 0.6s ease-out;
        }

        .active { display: flex; }

        /* 左右分欄佈局 (用於第三關) */
        .split-layout {
            display: flex;
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: center;
            gap: 3vw;
        }

        .split-left {
            flex: 2; /* 再次放大左側圖片區，提供更多空間給摩斯密碼表 */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        .split-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            border-left: 2px rgba(62, 42, 28, 0.1) solid; /* 加入淡淡的分隔線增加層次感 */
            padding-left: 2vw;
        }

        h1 {
            font-size: clamp(2rem, 6vh, 4.5rem);
            font-weight: 900;
            color: var(--text-color);
            margin-bottom: 2vh;
            letter-spacing: 0.2em;
            text-shadow: 1px 1px 1px rgba(255,255,255,0.5), -1px -1px 1px rgba(0,0,0,0.2);
        }

        /* 圖片尺寸通用設定 */
        .puzzle-image {
            max-width: 90%;
            max-height: 45vh;
            object-fit: contain;
            margin-bottom: 2vh;
            border: 4px solid var(--text-color);
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
            border-radius: 4px;
        }

        /* 第三關分欄模式下的大圖設定 (放大 1.5 倍邏輯) */
        .split-left .puzzle-image {
            max-height: 85vh; /* 提高垂直上限至 85% 螢幕高度 */
            max-width: 95%;   /* 增加水平寬度 */
            margin-bottom: 0;
            border-width: 5px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2vh;
            width: 100%;
        }

        input[type="text"] {
            font-family: 'Noto Serif TC', serif;
            font-weight: 700;
            font-size: clamp(1.2rem, 3.5vh, 2.5rem);
            padding: 1.2vh 2vw;
            width: 100%;
            max-width: 380px;
            border: 2px solid var(--accent-color);
            border-radius: 8px;
            background: rgba(255,255,255,0.7);
            text-align: center;
            text-transform: uppercase;
            color: #222;
            outline: none;
        }

        button {
            font-family: 'Noto Serif TC', serif;
            font-weight: 700;
            font-size: clamp(1rem, 2.5vh, 1.8rem);
            padding: 1.2vh 4vw;
            cursor: pointer;
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 5px;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            letter-spacing: 0.1em;
        }

        button:hover {
            background-color: #5d2e13;
            transform: translateY(-2px);
        }

        .home-btn {
            position: absolute;
            top: 2vh;
            right: 2vw;
            font-size: 0.9rem;
            padding: 0.5vh 1.5vw;
            background: rgba(74, 55, 40, 0.08);
            color: var(--text-color);
            border: 1px solid var(--text-color);
            z-index: 100;
            opacity: 0.6;
        }

        .feedback {
            font-size: clamp(0.9rem, 2.5vh, 1.6rem);
            height: 3.5vh;
            margin: 0.5vh 0;
            font-weight: 700;
        }

        .error { color: var(--error-color); }

        .success-row {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column; /* 改為垂直排列以便在右欄顯示 */
            gap: 1.5vh;
            margin-top: 1vh;
        }

        .success-text {
            color: var(--success-color);
            font-weight: 900;
            font-size: clamp(1.2rem, 3vh, 2.5rem);
        }

        .img-fallback {
            font-style: italic;
            color: #777;
            border: 2px dashed var(--text-color);
            padding: 20px;
            width: 100%;
            height: 50vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
    </style>
</head>
<body>

    <div class="game-frame">
        <button id="global-home-btn" class="home-btn" onclick="showPage('start-page')" style="display:none;">回首頁 (Esc)</button>

        <!-- 首頁 -->
        <div id="start-page" class="page active">
            <h1 style="font-size: clamp(4rem, 12vh, 9rem); margin-bottom: 5vh;">神祕日記</h1>
            <button id="start-btn" onclick="showPage('level-1')">開始冒險 (Enter)</button>
        </div>

        <!-- 第壹章 -->
        <div id="level-1" class="page">
            <h1>第壹章</h1>
            <div class="input-group">
                <input type="text" id="input-1" placeholder="請輸入答案" autocomplete="off">
                <div id="feedback-1" class="feedback"></div>
                <button id="btn-verify-1" onclick="checkAnswer(1)">驗證答案</button>
            </div>
            <div id="next-1" class="success-row" style="display:none;">
                <p class="success-text">鎖已解開</p>
                <button id="btn-next-1" onclick="showPage('level-2')">下一章 (Enter)</button>
            </div>
        </div>

        <!-- 第貳章 -->
        <div id="level-2" class="page">
            <h1>第貳章</h1>
            <img src="cup-map.png" alt="圖像線索" class="puzzle-image" onerror="handleImgError(this)">
            <div class="input-group">
                <input type="text" id="input-2" placeholder="請輸入答案" autocomplete="off">
                <div id="feedback-2" class="feedback"></div>
                <button id="btn-verify-2" onclick="checkAnswer(2)">驗證答案</button>
            </div>
            <div id="next-2" class="success-row" style="display:none;">
                <p class="success-text">方向正確</p>
                <button id="btn-next-2" onclick="showPage('level-3')">下一章 (Enter)</button>
            </div>
        </div>

        <!-- 第參章 (優化：極大化圖表與左右分欄) -->
        <div id="level-3" class="page">
            <div class="split-layout">
                <div class="split-left">
                    <img src="morse-chart.png" alt="摩斯密碼表" class="puzzle-image" onerror="handleImgError(this)">
                </div>
                <div class="split-right">
                    <h1>第參章</h1>
                    <div style="margin-bottom: 4vh;">
                        <audio id="morse-audio" src="morse_code.wav"></audio>
                        <button onclick="toggleAudio()" style="background-color: #5d4037; font-size: 1.2rem; padding: 1.8vh 4.5vw;">🔊 聆聽密碼音訊</button>
                    </div>
                    <div class="input-group">
                        <input type="text" id="input-3" placeholder="請輸入密碼答案" autocomplete="off">
                        <div id="feedback-3" class="feedback"></div>
                        <button id="btn-verify-3" onclick="checkAnswer(3)">驗證答案</button>
                        <div id="next-3" class="success-row" style="display:none;">
                            <p class="success-text">訊息完整</p>
                            <button id="btn-next-3" onclick="showPage('level-4')">下一章 (Enter)</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 最終章 -->
        <div id="level-4" class="page">
            <h1>最終章</h1>
            <img src="choice-boxes.png" alt="最終圖像" class="puzzle-image" onerror="handleImgError(this)">
            <div class="input-group">
                <input type="text" id="input-4" placeholder="請輸入終極箴言" autocomplete="off">
                <div id="feedback-4" class="feedback"></div>
                <button id="btn-verify-4" onclick="checkAnswer(4)">終極驗證</button>
            </div>
        </div>

        <!-- 成功結尾頁面 -->
        <div id="finish-page" class="page">
            <h1 style="color: var(--success-color); font-size: clamp(5rem, 14vh, 11rem); margin-bottom: 5vh;">冒險完成</h1>
            <button onclick="location.reload()">重新啟程</button>
        </div>

    </div>

    <script>
        const ANSWERS = { 1: "GLORY", 2: "STOP", 3: "PEACE", 4: "AMDG" };
        let currentPage = 'start-page';
        let completedLevels = { 1: false, 2: false, 3: false, 4: false };

        function showPage(pageId) {
            currentPage = pageId;
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');

            const homeBtn = document.getElementById('global-home-btn');
            homeBtn.style.display = (pageId === 'start-page' || pageId === 'finish-page') ? 'none' : 'block';

            const audio = document.getElementById('morse-audio');
            if (audio) { audio.pause(); audio.currentTime = 0; }

            const currentInput = document.querySelector(`#${pageId} input`);
            if (currentInput && !currentInput.disabled) { 
                setTimeout(() => currentInput.focus(), 150); 
            }
        }

        function checkAnswer(level) {
            const input = document.getElementById(`input-${level}`);
            const feedback = document.getElementById(`feedback-${level}`);
            const nextArea = document.getElementById(`next-${level}`);
            const verifyBtn = document.getElementById(`btn-verify-${level}`);
            
            const userAnswer = input.value.trim().toUpperCase();

            if (userAnswer === ANSWERS[level]) {
                completedLevels[level] = true;
                feedback.innerHTML = "";
                input.disabled = true;
                
                if (level === 4) {
                    showPage('finish-page');
                } else {
                    if (verifyBtn) verifyBtn.style.display = "none";
                    if (nextArea) nextArea.style.display = "flex";
                }
            } else {
                feedback.innerHTML = "線索就在此頁。";
                feedback.className = "feedback error";
                input.style.animation = "shake 0.4s";
                setTimeout(() => input.style.animation = "", 400);
            }
        }

        function handleImgError(img) {
            const fallback = document.createElement('div');
            fallback.className = "img-fallback";
            fallback.innerText = "[ 圖檔缺失: " + img.src.split('/').pop() + " ]";
            img.parentNode.replaceChild(fallback, img);
        }

        function toggleAudio() {
            const audio = document.getElementById('morse-audio');
            if (audio.paused) {
                audio.play().catch(() => {
                    const fb = document.getElementById('feedback-3');
                    fb.innerHTML = "音檔載入失敗。";
                    fb.className = "feedback error";
                });
            } else {
                audio.pause();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === "Escape") { showPage('start-page'); return; }
            if (e.key === "Enter") {
                if (currentPage === 'start-page') { showPage('level-1'); return; }
                if (currentPage === 'finish-page') { location.reload(); return; }
                const levelMatch = currentPage.match(/level-(\d+)/);
                if (levelMatch) {
                    const level = parseInt(levelMatch[1]);
                    if (completedLevels[level]) {
                        if (level < 4) showPage(`level-${level + 1}`);
                    } else {
                        checkAnswer(level);
                    }
                }
            }
        });
    </script>
</body>
</html>
