<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神祕日記：解謎冒險 - 投影專用版</title>
    <style>
        /* 基本風格設定 - 投影專用優化 */
        :root {
            --bg-color: #2c1a1a; 
            --paper-color: #e8d5b5; 
            --text-color: #4a3728; 
            --accent-color: #8b4513; 
            --error-color: #b22222; 
            --success-color: #228b22; 
        }

        /* 移除手機版限制，改為適合寬螢幕投影 */
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* 防止背景滾動 */
        }

        /* 羊皮紙容器 - 寬螢幕投影優化 */
        .container {
            width: 95vw;
            max-width: 1400px;
            height: 90vh;
            background-color: var(--paper-color);
            background-image: radial-gradient(circle, rgba(255,255,255,0.2) 0%, rgba(0,0,0,0.1) 100%);
            box-shadow: 0 0 60px rgba(0,0,0,0.6);
            border-radius: 15px;
            padding: 40px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            border: 20px solid #3d2b1f;
            border-image: linear-gradient(to bottom right, #5d4037, #2c1e1e) 1;
            overflow: hidden; 
        }

        /* 字體極大化以利投影 */
        h1 {
            font-size: 5rem;
            margin-top: 10px;
            margin-bottom: 20px;
            color: var(--text-color);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        p {
            font-size: 2.5rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        /* 圖片處理 - 預設限制高度 */
        .puzzle-image {
            max-width: 80%;
            max-height: 45vh; 
            margin-bottom: 20px;
            border: 5px solid var(--text-color);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            border-radius: 5px;
            object-fit: contain;
        }

        /* 特別放大第三關的圖片 */
        #level-3 .puzzle-image {
            max-height: 60vh; 
            max-width: 90%;
        }

        .img-fallback {
            font-style: italic;
            color: #777;
            margin: 20px 0;
            font-size: 2rem;
            border: 2px dashed var(--text-color);
            padding: 15px;
        }

        /* 輸入與按鈕區域佈局 */
        .input-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        input[type="text"] {
            font-size: 3rem;
            padding: 15px;
            width: 45%;
            min-width: 400px;
            border: 4px solid var(--accent-color);
            border-radius: 15px;
            background: rgba(255,255,255,0.7);
            text-align: center;
            text-transform: uppercase;
        }

        button {
            font-size: 2.5rem;
            padding: 15px 50px;
            cursor: pointer;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 15px;
            transition: all 0.2s;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
        }

        button:hover {
            background-color: #a0522d;
            transform: translateY(-3px);
        }

        /* 成功跳轉區塊 - 水平排列 */
        .success-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            width: 100%;
            margin-top: 10px;
        }

        .success-text {
            color: var(--success-color);
            font-size: 2.2rem;
            font-weight: bold;
            margin: 0;
        }

        /* 右上角回首頁按鈕 */
        .home-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            font-size: 1.5rem;
            padding: 10px 30px;
            background-color: rgba(74, 55, 40, 0.1);
            color: var(--text-color);
            border: 2px solid var(--text-color);
            box-shadow: none;
            z-index: 10;
        }

        .feedback {
            font-size: 2rem;
            height: 2.5rem;
            margin: 5px 0;
            font-weight: bold;
        }

        .error { color: var(--error-color); }

        .page {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .active { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-15px); }
            40%, 80% { transform: translateX(15px); }
        }

        /* 最終頁面特大標題 */
        .final-title {
            font-size: 10rem;
            color: var(--success-color);
            animation: fadeIn 2s ease-in-out;
            margin-bottom: 50px;
        }
    </style>
</head>
<body>

    <div class="container">
        <button id="global-home-btn" class="home-btn" onclick="showPage('start-page')" style="display:none;">回首頁</button>

        <!-- 首頁 -->
        <div id="start-page" class="page active">
            <h1 style="font-size: 8rem; margin-bottom: 10px;">神祕日記</h1>
            <p style="margin-bottom: 50px;">一段尋找真理的旅程即將展開...</p>
            <button onclick="showPage('level-1')">開始冒險</button>
        </div>

        <!-- 第一關 -->
        <div id="level-1" class="page">
            <h1>第一關</h1>
            <div class="input-group">
                <input type="text" id="input-1" placeholder="請輸入答案" onkeypress="handleEnter(event, 1)">
                <div id="feedback-1" class="feedback"></div>
                <button id="btn-verify-1" onclick="checkAnswer(1)">驗證</button>
            </div>
            <div id="next-1" class="success-row" style="display:none;">
                <p class="success-text">答案正確！</p>
                <button onclick="showPage('level-2')">前往第二關</button>
            </div>
        </div>

        <!-- 第二關 -->
        <div id="level-2" class="page">
            <h1>第二關</h1>
            <img src="cup-map.png" alt="cup-map.png" class="puzzle-image" onerror="handleImgError(this)">
            <div class="input-group">
                <input type="text" id="input-2" placeholder="請輸入答案" onkeypress="handleEnter(event, 2)">
                <div id="feedback-2" class="feedback"></div>
                <button id="btn-verify-2" onclick="checkAnswer(2)">驗證</button>
            </div>
            <div id="next-2" class="success-row" style="display:none;">
                <p class="success-text">答案正確！</p>
                <button onclick="showPage('level-3')">前往第三關</button>
            </div>
        </div>

        <!-- 第三關 -->
        <div id="level-3" class="page">
            <h1>第三關</h1>
            <img src="morse-chart.png" alt="morse-chart.png" class="puzzle-image" onerror="handleImgError(this)">
            <div style="margin-bottom: 20px;">
                <audio id="morse-audio" src="morse_code.wav"></audio>
                <button onclick="toggleAudio()" style="background-color: #5d4037; padding: 10px 40px; font-size: 2rem;">🔊 播放 / 暫停音檔</button>
            </div>
            <div class="input-group">
                <input type="text" id="input-3" placeholder="請輸入答案" onkeypress="handleEnter(event, 3)">
                <div id="feedback-3" class="feedback"></div>
                <button id="btn-verify-3" onclick="checkAnswer(3)">驗證</button>
            </div>
            <div id="next-3" class="success-row" style="display:none;">
                <p class="success-text">答案正確！</p>
                <button onclick="showPage('level-4')">前往第四關</button>
            </div>
        </div>

        <!-- 第四關 -->
        <div id="level-4" class="page">
            <h1>第四關</h1>
            <img src="choice-boxes.png" alt="choice-boxes.png" class="puzzle-image" onerror="handleImgError(this)">
            <div class="input-group">
                <input type="text" id="input-4" placeholder="請輸入答案" onkeypress="handleEnter(event, 4)">
                <div id="feedback-4" class="feedback"></div>
                <button id="btn-verify-4" onclick="checkAnswer(4)">驗證</button>
            </div>
        </div>

        <!-- 成功結尾頁面 -->
        <div id="finish-page" class="page">
            <h1 class="final-title">恭喜過關</h1>
            <button onclick="location.reload()">重新開始</button>
        </div>

    </div>

    <script>
        // 答案配置
        const ANSWERS = { 1: "GLORY", 2: "STOP", 3: "PEACE", 4: "AMDG" };

        // 切換頁面邏輯
        function showPage(pageId) {
            const pages = document.querySelectorAll('.page');
            pages.forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');

            // 判斷回首頁按鈕顯示
            const homeBtn = document.getElementById('global-home-btn');
            homeBtn.style.display = (pageId === 'start-page' || pageId === 'finish-page') ? 'none' : 'block';

            // 換頁停止音效
            const audio = document.getElementById('morse-audio');
            if (audio) { audio.pause(); audio.currentTime = 0; }

            // 自動聚焦
            const currentInput = document.querySelector(`#${pageId} input`);
            if (currentInput) { setTimeout(() => currentInput.focus(), 100); }
        }

        // 檢查答案
        function checkAnswer(level) {
            const input = document.getElementById(`input-${level}`);
            const feedback = document.getElementById(`feedback-${level}`);
            const next = document.getElementById(`next-${level}`);
            const btn = document.getElementById(`btn-verify-${level}`);
            
            const userAnswer = input.value.trim().toUpperCase();

            if (userAnswer === ANSWERS[level]) {
                feedback.innerHTML = "";
                input.disabled = true;
                
                if (level === 4) {
                    // 第四關答對直接跳轉最後一頁
                    showPage('finish-page');
                } else {
                    if (btn) btn.style.display = "none";
                    if (next) next.style.display = "flex";
                }
            } else {
                feedback.innerHTML = "再看看線索，試試看。";
                feedback.className = "feedback error";
                input.style.animation = "shake 0.5s";
                setTimeout(() => input.style.animation = "", 500);
            }
        }

        // 監聽 Enter 鍵
        function handleEnter(event, level) {
            if (event.key === "Enter") checkAnswer(level);
        }

        // 圖片錯誤處理
        function handleImgError(img) {
            const fallback = document.createElement('div');
            fallback.className = "img-fallback";
            fallback.innerText = "[ 圖片遺失: " + img.alt + " ]";
            img.parentNode.replaceChild(fallback, img);
        }

        // 音訊控制
        function toggleAudio() {
            const audio = document.getElementById('morse-audio');
            if (audio.paused) {
                audio.play().catch(() => {
                    const fb = document.getElementById('feedback-3');
                    fb.innerHTML = "音檔載入失敗，請確認檔案 morse_code.wav 是否存在。";
                    fb.className = "feedback error";
                });
            } else {
                audio.pause();
            }
        }

        // Esc 快捷鍵回首頁
        document.addEventListener('keydown', (e) => {
            if(e.key === "Escape") showPage('start-page');
        });
    </script>
</body>
</html>
